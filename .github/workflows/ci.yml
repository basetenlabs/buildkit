name: CI

on:
  pull_request:
    branches:
      - v0.22-base

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: golangci/golangci-lint-action@v7
        with:
          # Mirror upstream moby/buildkit: build golangci-lint from source with our
          # Go toolchain (install-mode: goinstall) instead of the pre-built release
          # binary. A pre-built binary is compiled with its release's Go (v2.1.5 ->
          # go1.24) and can't analyze our Go 1.25 code; building from source with
          # GO_VERSION makes the pinned version compatible. Version matches upstream
          # v0.22 (hack/dockerfiles/lint.Dockerfile: GOLANGCI_LINT_VERSION=v2.1.5).
          version: v2.1.5
          install-mode: goinstall
          args: --modules-download-mode=vendor
          only-new-issues: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run unit tests
        run: |
          go test -mod=vendor -count=1 -timeout 10m \
            $(go list -mod=vendor ./... | grep -v -E '(worker/(containerd|runc)|cache$|cache/contenthash|snapshot$|source/(git|http)|util/overlay)$')
        env:
          SKIP_INTEGRATION_TESTS: "1"
